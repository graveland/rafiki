syntax = "proto3";

package rafiki.executor.v1;

option go_package = "go.graveland.dev/rafiki/pkg/executorpb;executorpb";

service ExecutorService {
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Execute(ExecuteRequest) returns (stream ExecuteResponse);
  rpc Attach(AttachRequest) returns (stream AttachResponse);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc JobOutput(JobOutputRequest) returns (JobOutputResponse);
  // Provision prepares a workspace for one child and returns a handle every
  // later Execute carries. A native executor answers with its pinned root and
  // does nothing else; a container executor starts a container.
  rpc Provision(ProvisionRequest) returns (ProvisionResponse);
  // Release tears a workspace down. Idempotent: a daemon restart that lost
  // track of a workspace must be able to release it again without error.
  rpc Release(ReleaseRequest) returns (ReleaseResponse);
  // ProjectContext returns the instruction files belonging to a workspace:
  // CLAUDE.md and AGENTS.md at the git root and at the workdir, with @includes
  // already expanded.
  //
  // It is a separate call rather than a field on ProvisionResponse because it
  // returns CONTENT, and content is unbounded where a workspace handle is not:
  // a large CLAUDE.md would make every provision pay for it. It is separate
  // from Describe for a different reason — Describe is per-EXECUTOR and this is
  // per-workspace, so Describe structurally cannot answer it.
  rpc ProjectContext(ProjectContextRequest) returns (ProjectContextResponse);
  // ProjectSkills returns the skills discovered in a workspace — the project
  // tier only. User and system skills belong to whoever runs the agent loop and
  // are never reported here.
  //
  // Metadata only. Bodies are fetched by SkillBody on the turn a model actually
  // asks for one: an inventory is a handful of lines per skill, while a body is
  // a document, and returning every body at spawn would put the whole project's
  // skill text into every child.
  rpc ProjectSkills(ProjectSkillsRequest) returns (ProjectSkillsResponse);

  // SkillBody returns one project skill's body, resolved by NAME against the
  // executor's own discovery.
  //
  // By name and not by path, for the same reason ProjectContext takes a
  // workspace id: a path parameter would let anything that reaches this
  // executor read an arbitrary file on it.
  rpc SkillBody(SkillBodyRequest) returns (SkillBodyResponse);
}

message DescribeRequest {}
message DescribeResponse {
  string executor_id = 1;
  string platform = 2;
  repeated string roots = 3;
  int32  concurrency = 4;
  string isolation = 5;
  string workspace_mode = 6;
  repeated string tools = 7;
  string version = 8;
  map<string, string> self_reported_labels = 9;
}

message HealthRequest {}
message HealthResponse {
  double load = 1;
  repeated string running_handles = 2;
  int64  disk_free_bytes = 3;
  bool   draining = 4;
}

message ContentBlock {
  oneof block {
    string text = 1;
    ImageBlock image = 2;
  }
}
message ImageBlock {
  string media_type = 1;
  bytes  data = 2;
}

message ExecuteRequest {
  string call_id = 1;
  string tool = 2;
  bytes  input_json = 3;
  int64  timeout_ms = 4;
  map<string, int64> expect_mtime = 5;
  bool   background = 6;
  // workspace_id selects the workspace this call runs in. Empty means the
  // executor's own root — the pre-phase-08 behaviour, kept so an executor and
  // a daemon of different vintages still interoperate.
  string workspace_id = 7;
}

message ExecuteResponse {
  oneof event {
    OutputChunk output = 1;
    Result      result = 2;
    Failure     failed = 3;
    string      handle = 4;
  }
}
message OutputChunk { bytes data = 1; }
message Result {
  repeated ContentBlock content = 1;
  bool is_error = 2;
  map<string, int64> observed_mtime = 3;
}
message Failure {
  enum Code {
    CODE_UNSPECIFIED = 0;
    CODE_DENIED = 1;
    CODE_EXECUTOR_LOST = 2;
    CODE_TOOL_FAILED = 3;
    CODE_TIMEOUT = 4;
  }
  Code   code = 1;
  string message = 2;
}

message AttachRequest { string handle = 1; }
message AttachResponse {
  oneof event {
    OutputChunk output = 1;
    int32       exit_code = 2;
  }
}

message CancelRequest { string call_id = 1; }
message CancelResponse {}

// Mount is one bind mount. The DAEMON derives these from the child's worktree
// assignment; the model never writes a path, and the executor never invents
// one. Anything the executor added here would be a grant nobody authorised.
message Mount {
  string host_path      = 1;
  string container_path = 2;
  bool   read_only      = 3;
}

message ProvisionRequest {
  // child_id is the daemon's id for the child this workspace serves. It is
  // used for naming and for idempotency, never for authority.
  string child_id = 1;
  // ephemeral: the executor constructs the workspace and it is
  // reconstructible, so the child may be rescheduled elsewhere on loss.
  // pinned: the executor exposes an existing tree; losing it means park or
  // fail. This single field is what the park-vs-fail decision consults.
  string workspace_mode = 2;
  repeated Mount mounts = 3;
  // workdir is the container path the child's tools start in. It must be one
  // of the mounts' container_path values; an executor MUST reject anything
  // else rather than silently starting somewhere the child cannot write.
  string workdir = 4;
  // network is "none" or "bridge". Default none: an unattended worker that
  // does not need egress should not have it, and a build that needs a package
  // registry is a deliberate choice rather than an accident.
  string network = 5;
  // Resource caps. Zero means the executor's own default.
  int64 memory_bytes = 6;
  double cpus        = 7;
  map<string, string> env = 8;
}

message ProvisionResponse {
  string workspace_id = 1;
  // roots the workspace actually exposes, as the CHILD will see them. The
  // daemon puts these in the child's system prompt (phase 09): a sandboxed
  // worker that does not know it is sandboxed misreads its first denial as a
  // broken repository.
  repeated string roots = 2;
  string workdir = 3;
  string isolation = 4;
}

message ReleaseRequest  { string workspace_id = 1; }
message ReleaseResponse {}

message ProjectContextRequest {
  // workspace_id from Provision. The executor resolves the workdir itself
  // rather than taking a path, so a caller cannot ask for the contents of an
  // arbitrary directory on the executor's filesystem.
  string workspace_id = 1;
}

message ProjectContextResponse {
  // Concatenated instruction-file content, includes already expanded. Empty is
  // the ordinary answer for a directory with neither file, and is not an error.
  //
  // Expanded on THIS side deliberately: an @include names a path on the
  // executor's filesystem, which the daemon cannot resolve.
  string context_files = 1;
}

message ProjectSkillsRequest {
  string workspace_id = 1;
}

message ProjectSkill {
  string name = 1;
  string description = 2;
  // dir is the skill's own directory as the EXECUTOR sees it. The daemon does
  // not resolve it — it is passed to the model as "Base directory for this
  // skill", which is correct precisely because the model's file tools run on
  // the executor too.
  string dir = 3;
}

message ProjectSkillsResponse {
  repeated ProjectSkill skills = 1;
}

message SkillBodyRequest {
  string workspace_id = 1;
  string name = 2;
}

message SkillBodyResponse {
  string body = 1;
  string dir = 2;
}

// JobOutput is the one-shot poll behind bash_output. Attach is a stream and
// draining it to answer "what has this printed so far" means either blocking
// until exit or racing a deadline.
message JobOutputRequest {
  string handle = 1;
  // Byte offset into the job's lifetime output. 0 means "from whatever is
  // still retained". Pass back the previous response's `total` to poll.
  int64  since = 2;
}
message JobOutputResponse {
  bytes data = 1;
  // Bytes the job has ever written, including any dropped from the ring.
  int64 total = 2;
  bool  exited = 3;
  int32 exit_code = 4;
  // false when the handle is unknown — either never started, or reaped
  // after the retention window.
  bool  found = 5;
}
