syntax = "proto3";

package rafiki.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "go.graveland.dev/rafiki/pkg/gen/rafiki/v1;rafikiv1";

// StopReason normalizes how a turn ended across providers. The provider's own
// string is preserved in TurnEnd.raw_stop_reason: Anthropic says "end_turn",
// OpenAI says "stop", and consumers must not have to know which.
enum StopReason {
  STOP_REASON_UNSPECIFIED = 0;
  STOP_REASON_END_TURN = 1;
  STOP_REASON_MAX_TOKENS = 2;
  STOP_REASON_TOOL_USE = 3;
  STOP_REASON_STOP_SEQUENCE = 4;
  STOP_REASON_REFUSAL = 5;
  STOP_REASON_ERROR = 6;
}

// Usage counts for one turn. Every field is optional because providers report
// different subsets: OpenAI reports cached read tokens but has no cache-write
// count. A zero must mean "reported as zero"; absence must mean "not reported".
// Collapsing the two silently poisons cost math and ProviderGuard's evidence.
message Usage {
  optional int64 input_tokens = 1;
  optional int64 output_tokens = 2;
  optional int64 cache_read_tokens = 3;
  optional int64 cache_write_tokens = 4;
  optional int64 reasoning_tokens = 5;
}

message TextBlock {
  string text = 1;
}

// ThinkingBlock.signature is an opaque provider token, not parsed by rafiki.
// Anthropic returns a signature for multi-turn tool use; OpenAI reasoning
// returns an encrypted blob with different rules. Treat it as bytes with a
// meaning only the provider knows.
message ThinkingBlock {
  string thinking = 1;
  string signature = 2;
}

// ToolUseBlock.input_json is the tool's arguments as a raw JSON string. It is
// deliberately NOT modeled: the shape is whatever the model emitted for
// whatever tool, and typing it would mean regenerating this schema every time
// a tool changes.
message ToolUseBlock {
  string id = 1;
  string name = 2;
  string input_json = 3;
}

message ImageBlock {
  string media_type = 1;
  bytes data = 2;
}

// ToolResultBlock.content is repeated ContentBlock, not a string, so a tool
// that returns an image (read on a PNG) is expressible. Flattening it to a
// string would make multimodal tool output a breaking change later.
message ToolResultBlock {
  string tool_use_id = 1;
  repeated ContentBlock content = 2;
  bool is_error = 3;
}

// ContentBlock.index is assigned by rafiki and is monotonic within a turn. It
// is NOT the provider's index: OpenAI puts tool_calls[].index in a separate
// index space from content, and this field unifies them.
message ContentBlock {
  int32 index = 1;
  oneof block {
    TextBlock text = 2;
    ThinkingBlock thinking = 3;
    ToolUseBlock tool_use = 4;
    ImageBlock image = 5;
    ToolResultBlock tool_result = 6;
  }
}

// UserMessage is a durable-tier event: a persisted user-role message.
message UserMessage {
  repeated ContentBlock content = 1;
}

// AssistantMessage is a durable-tier event: a persisted assistant-role message.
message AssistantMessage {
  repeated ContentBlock content = 1;
  // stop_reason/raw_stop_reason mirror TurnEnd's fields (same rationale:
  // rafiki's normalized enum plus the provider's own string). Only
  // meaningful for assistant rows — the store loads StopReason for those and
  // leaves it empty for user rows.
  StopReason stop_reason = 2;
  string raw_stop_reason = 3;
  // cost_usd is the RUNNING total for the CURRENT TURN only, so far —
  // every iteration of THIS turn up to and including this reply, but
  // deliberately excluding every completed prior turn. It is NOT the final
  // per-turn cost TurnEnd.cost_usd reports (that is this same turn's cost
  // once it ends), and it is NOT a conversation-lifetime total: a client
  // that wants the lifetime figure sums settled TurnEnd.cost_usd values and
  // adds this. Optional for the same reason every Usage/cost field in this
  // proto is: absence and a reported zero are different facts, and a client
  // (the TUI rail) needs to tell "not yet priced" from "genuinely free".
  optional double cost_usd = 4;
}

message TurnStart {
  string turn_id = 1;
  string model = 2;
}

message TurnEnd {
  string turn_id = 1;
  StopReason stop_reason = 2;
  string raw_stop_reason = 3;
  // usage is the FINAL LLM call's usage of the turn — the prompt size the
  // NEXT call will carry — not a turn total. An agentic turn makes one call
  // per tool round and every call re-reads the cached prefix, so a summed
  // cache_read would count the context once per call and read many times
  // larger than the real context size. The turn's summed cost still rides
  // cost_usd below; per-call usage lives in conversation_turn.
  Usage usage = 4;
  optional double cost_usd = 5;
}

// ContentBlockDelta is an ephemeral-tier event: an incremental fragment of an
// in-flight turn. Ephemeral events carry no ordinal and are never replayed on
// reconnect.
message ContentBlockDelta {
  string turn_id = 1;
  int32 index = 2;
  oneof delta {
    string text = 3;
    string thinking = 4;
    string input_json = 5;
  }
}

// AgentStatus.state is one of protocol.Status's ten values, exactly:
// "spawning", "idle", "streaming", "running", "tool_running",
// "compacting", "batch_wait", "blocked_ui", "shutting_down", "exited". It is
// a string rather than an enum so a new daemon status does not require
// regenerating every client, but the set is CLOSED — do not invent values
// here. Note that pi's distinction between "this run ended" and "truly idle"
// is expressed as a transition back to "idle"; there is no separate settled
// event. "running" is a script child whose process is alive: scripts have no
// turns, so they never report idle/streaming — output never moves the status.
message AgentStatus {
  string state = 1;
}

message ErrorEvent {
  string code = 1;
  string message = 2;
}

// ToolExecutionStart / ToolExecutionEnd carry tool TIMING. They are
// DURABLE-tier — pkg/eventlog/tier.go is the authority, and this comment said
// "ephemeral" until C1b corrected it. The durable record of a tool call remains
// the ToolUseBlock and ToolResultBlock content blocks; these add only what a
// content block cannot express: when execution began and how long it took, so a
// client can render "bash running... 12s" rather than a frozen screen. They are
// the volume edge of the durable tier and the first thing to demote if
// measurement says it is too chatty — demote with numbers, not intuition.
message ToolExecutionStart {
  string tool_use_id = 1;
  string name = 2;
}

message ToolExecutionEnd {
  string tool_use_id = 1;
  reserved 2;
  reserved "duration_ms";
  bool is_error = 3;
  // duration is how long execution took. A zero value means the start was
  // never seen (a turn resumed mid-tool), exactly as the old duration_ms=0 did.
  google.protobuf.Duration duration = 4;
}

// Retry reports a turn-level retry attempt, so a supervisor can see an agent
// looping rather than silently stalling. The daemon's rate-limit auto-resume
// (cmd/rafikid's ratelimit_resume.go) is today's only producer: will_retry
// true announces a scheduled resume (reason is the cause; the fire instant is
// resume_at), false resolves the earlier announcement (fired, cleared
// by a success, or attempts exhausted; reason carries the human sentence).
//
// Wall-clock times are never embedded in reason: the producing daemon's clock
// zone is arbitrary (a container typically runs UTC), so a time it formats is
// never the viewer's local time. Anything time-shaped travels as a Timestamp
// and the client renders it in its own zone.
message Retry {
  int32 attempt = 1;
  bool will_retry = 2;
  string reason = 3;
  // The instant a will_retry=true schedule fires. Unset is meaningful:
  // resolution events (will_retry=false) name no schedule, and event rows
  // written before the field existed have none. Clients render it in the
  // viewer's local zone.
  reserved 4;
  reserved "resume_at_unix_ms";
  google.protobuf.Timestamp resume_at = 6;
  // The producer's attempt cap, so a client can render "attempt 1/3" without
  // parsing reason. 0 means not reported.
  int32 max_attempts = 5;
}

// ChildSpawned / ChildExited carry the agent tree's edges. rafiki models a
// sub-agent as a CHILD with its own child_id and its own conversation, not as
// an in-conversation tool call, so these — not a parent_tool_use_id field on a
// tool block — are how lineage reaches a client.
message ChildSpawned {
  string child_id = 1;
  string parent_id = 2;
  string name = 3;
}

message ChildExited {
  string child_id = 1;
  // exit_code is optional because absence is meaningful: a signalled child has
  // no exit code, and 0 means success. Collapsing them loses that.
  optional int32 exit_code = 2;
  string signal = 3;
}

// CompactionBoundary marks a claude child's context having been rewritten by
// Claude Code's own compaction (never fundi's -- fundi compaction does not
// exist yet). pre_tokens/post_tokens are optional, not bare int32, because a
// reattach-synthesized instance of this event (built from a stored marker
// row, not the live stream) can only ever supply pre_tokens -- a bare zero
// would be indistinguishable from "compaction dropped everything."
message CompactionBoundary {
  string trigger = 1;
  optional int32 pre_tokens = 2;
  optional int32 post_tokens = 3;
}

// ScriptReport is one progress report a script child published with the
// Connect Report verb. It appears in the child's own durable event log only
// when the script is top-level (no parent to push to); a parented script's
// reports ride its parent's event buffer instead. kind is the caller's
// discriminator, data_json the payload verbatim (already validated and
// size-capped by the handler).
message ScriptReport {
  string kind = 1;
  string data_json = 2;
}

// ScriptOutput is one chunk of a script child's raw stdout/stderr — the
// child's durable output record. A script child has no conversation rows and
// no turns, so this event, not GetHistory, is what a client backfills from.
// stream is "stdout" or "stderr"; text is the verbatim output, coalesced by
// the daemon (flush at 4 KiB or 250 ms, whichever first; a single line longer
// than 4 KiB is split at 4 KiB, never otherwise).
message ScriptOutput {
  string stream = 1;
  string text = 2;
}

// Event is the stream envelope.
//
// ordinal is set on DURABLE-tier events — fourteen durable types as of the
// script-output work, not the thirteen this comment named before it and not
// the two this comment originally named. pkg/eventlog/tier.go is the authority.
//
// It is the EVENT LOG's per-child ordinal (conversations.event_log, migration
// 0023): zero-based and gap-free per child. It is NOT conversation_message.
// ordinal, which this comment also used to claim — those are separate spaces,
// and GetHistory speaks the message one while this stream speaks the event one.
//
// Ephemeral events (content_block_delta) leave it unset. A client resumes with
// StreamEventsRequest.cursor, which is per-child; the old flat after_ordinal is
// `reserved 2` on that message.
//
// A durable event can still arrive with ordinal UNSET, and consumers that count
// ordinals must handle it. Controller.publishEvent appends to the log and stamps
// the assigned ordinal onto the copy it publishes, but that append is
// deliberately best-effort: on failure it logs at warn and publishes anyway,
// because a log write must never stop a turn.
message Event {
  string child_id = 1;
  optional int32 ordinal = 2;
  reserved 3;
  reserved "ts_unix_ms";
  // ts is when the event was produced. Unset on events decoded from rows
  // written before this field was a Timestamp; the reader falls back to the
  // row's created_at.
  google.protobuf.Timestamp ts = 25;

  oneof payload {
    UserMessage user_message = 10;
    AssistantMessage assistant_message = 11;
    TurnStart turn_start = 12;
    ContentBlockDelta content_block_delta = 13;
    TurnEnd turn_end = 14;
    AgentStatus agent_status = 15;
    ErrorEvent error = 16;
    ToolExecutionStart tool_execution_start = 17;
    ToolExecutionEnd tool_execution_end = 18;
    Retry retry = 19;
    ChildSpawned child_spawned = 20;
    ChildExited child_exited = 21;
    CompactionBoundary compaction_boundary = 22;
    ScriptReport script_report = 23;
    ScriptOutput script_output = 24;
  }
}
