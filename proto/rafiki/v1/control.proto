syntax = "proto3";

package rafiki.v1;

import "rafiki/v1/event.proto";
import "rafiki/daraja/v1/daraja.proto";

option go_package = "go.graveland.dev/rafiki/pkg/gen/rafiki/v1;rafikiv1";

message GetHistoryRequest {
  string child_id = 1;
  // Return only durable events with ordinal strictly greater than this.
  // Unset means the whole conversation.
  optional int32 after_ordinal = 2;
}

message GetHistoryResponse {
  repeated Event events = 1;
}

// EventSubject names which children a subscription covers. It is a PREDICATE
// evaluated per event, never a set resolved when the stream opens -- that is
// what lets a child spawned later appear with no reopening and no poll.
message EventSubject {
  oneof scope {
    string child   = 1;  // one child, itself
    string subtree = 2;  // descendants of this child, bounded by max_depth
    bool   all     = 3;  // everything the caller is entitled to
  }
  // Narrows only. Never widens, and never the authority -- authority is
  // evaluated server-side and intersected. A malformed selector EXCLUDES.
  string label_selector = 4;

  // Hops below `subtree`. UNSET or 0 means UNLIMITED; 1 means direct children
  // only. Ignored for `child` and `all`. Unlimited is the default because a
  // watcher wants a complete model; the agent path sets 1 explicitly.
  int32 max_depth = 5;

  // Include the subtree root itself. Ignored for `child` and `all`.
  //
  // This is the one subject field that WIDENS. It is safe because it widens by
  // exactly one child -- the one the subscriber already named -- and authority
  // is still evaluated server-side and intersected, so naming a child you are
  // not entitled to admits nothing. Default false keeps `subtree` meaning what
  // the agent path relies on: max_depth=1 is "my direct children", never "me
  // and my children". A cockpit attached to a child sets this, because
  // otherwise the child it is attached TO is the one row it never hears about.
  bool include_self = 6;
}

// EventTier is the guarantee a subscriber asks for, not a storage detail.
enum EventTier {
  EVENT_TIER_UNSPECIFIED = 0;  // treated as DURABLE
  EVENT_TIER_DURABLE     = 1;  // replayable, ordinal-carrying
  EVENT_TIER_ALL         = 2;  // durable + ephemeral deltas
}

// EventCursor resumes a subscription.
message EventCursor {
  // child_id -> last ordinal seen. A child absent from this map replays from
  // floor_unix_ms. Without the floor, a child that spawned and exited entirely
  // during a disconnect is indistinguishable from a brand new one.
  map<string, int32> ordinals      = 1;
  int64              floor_unix_ms = 2;
}

message StreamEventsRequest {
  EventSubject         subject = 4;
  EventTier            tier    = 5;
  repeated string      types   = 6;  // empty = every type in the tier
  optional EventCursor cursor  = 7;  // absent = from now, no replay

  reserved 1, 2;  // was: child_ids, after_ordinal
  reserved "child_ids", "after_ordinal";
}

// SendMode is how a submitted message reaches the agent. PROMPT queues work;
// STEER injects into the turn already running; ABORT cancels it. Steer and
// abort are first-class verbs rather than escape hatches — supervising a busy
// agent is the primary use, not the exception.
enum SendMode {
  SEND_MODE_UNSPECIFIED = 0;
  SEND_MODE_PROMPT = 1;
  SEND_MODE_STEER = 2;
  SEND_MODE_ABORT = 3;
}

// SendRequest carries content BLOCKS rather than a string so a pasted image
// needs no breaking change later. For ABORT, blocks is ignored.
message SendRequest {
  string child_id = 1;
  SendMode mode = 2;
  repeated ContentBlock blocks = 3;
}

message SendResponse {
  // Server-assigned id for the accepted message.
  string message_id = 1;
}

// ─── Script children (Report / Receive / SetResult) ─────────────────────────
// The three verbs a script child (a process, not an LLM) talks to the daemon
// with. All three are childScoped, and all three act on the CALLER'S OWN
// position in the tree, resolved from the credential — never from a request
// field. Report pushes upward to the caller's own parent; Receive and
// SetResult are strictly self-only.

// Report publishes progress from a script child to its parent's event buffer,
// where it coalesces and defers exactly like a subagent settle
// (notifySubagentSettled): five reports between the parent's turns cost one
// injected frame, not five.
message ReportRequest {
  // kind is the report's discriminator ("progress", "log", "error", ...).
  // Required, at most 64 bytes, and no control characters — it is rendered
  // verbatim inside the fragment the parent's frame carries.
  string kind = 1;
  // data_json is the report payload as a JSON object (or any valid JSON
  // value). Required to PARSE as JSON — after trimming surrounding
  // whitespace; the trimmed value is what is stored — and capped at
  // MaxReportDataBytes (4 KiB); oversized or malformed data is refused with
  // CodeInvalidArgument rather than truncated — a silently truncated JSON
  // payload is worse than an explicit error, and the cap keeps a report
  // fragment well inside the event buffer's own per-fragment truncation.
  string data_json = 2;
}

message ReportResponse {}

// ReceiveRequest has one field, and it is a self-check, not an address: a
// caller may only receive its own inbox.
message ReceiveRequest {
  // When set, must equal the caller's own child id (CodePermissionDenied
  // otherwise — this is the one childScoped verb whose check is identity, not
  // subtree, so it cannot go through ChildScope.Authorize, which refuses the
  // caller's own id). Empty means the caller's own id.
  string child_id = 1;
}

// ScriptMessage is one message streamed to a script child over Receive.
message ScriptMessage {
  // Text is work delivered to the child's inbox: an agent_send (prompt or
  // steer) aimed at this child. The modes mirror SendMode minus ABORT — an
  // abort arrives as the stop variant below, because to a script both mean
  // "stop what you are doing".
  message Text {
    string text = 1;
    SendMode mode = 2;  // PROMPT or STEER; never ABORT here
    // The durable row id this message was assembled from — exactly one
    // today, because a message carries one inbox row (the Receive stream
    // delivers a pulled batch row by row rather than coalescing it).
    // Repeated so a future batching change needs no wire change. This is
    // what a caller quotes when asking what a script received.
    repeated string message_ids = 3;
    // Non-text payloads attached by Send (an image pasted beside a question).
    repeated ImageBlock attachments = 4;
  }
  // Stop tells the script to shut down gracefully. It is delivered by the
  // Receive stream's lifecycle poll — within roughly one poll interval of
  // the child entering shutting_down, which still precedes the SIGTERM and
  // SIGKILL rungs because those wait out the shutdown timeout — not by a
  // synchronous pre-signal push. The kill escalation that already exists is
  // the backstop either way, and an inbox abort is delivered as one too.
  message Stop {
    // why the daemon is stopping the script ("stopped by operator",
    // "abort requested"). Informational only.
    string reason = 1;
  }
  oneof body {
    Text text = 1;
    Stop stop = 2;
  }
}

// SetResultRequest is a plain unary call, not streamed — the script calls it
// once at the end of its work. See ReceiveRequest for the self-only rule.
message SetResultRequest {
  // result_json is the script's structured final result as JSON. Required to
  // PARSE as JSON — after trimming surrounding whitespace; the trimmed value
  // is what is stored — and capped at MaxResultBytes (4 KiB); oversized or
  // malformed data is refused with CodeInvalidArgument. Last write wins:
  // every call replaces the stored result, and the value present when the
  // child settles rides the settle fragment and GetChild.
  string result_json = 1;
}

message SetResultResponse {}

// ChildSummary mirrors protocol.ChildSummary. Only the fields a client renders
// are carried; this is deliberately not a field-for-field mirror, because a
// mirrored type nobody enforces drifts.
message ChildSummary {
  string child_id = 1;
  string name = 2;
  string kind = 3;
  string status = 4;
  string model = 5;
  string cwd = 6;
  // pid is optional: an exited child has none, and 0 is a legal pid.
  optional int32 pid = 7;
  int64 started_at = 8;
  int64 last_activity = 9;
  // exit_code is optional: unset while alive, and 0 means clean exit.
  optional int32 exit_code = 10;
  map<string, string> labels = 11;
  string session_id = 12;
  int32 context_window = 13;
  // latest_ordinal is the child's highest durable event ordinal, so a client
  // can seed an unread watermark without a history load per child. Optional
  // because 0 is a legal ordinal and "no events yet" must stay distinguishable.
  optional int32 latest_ordinal = 14;
  // cost_usd is this child's total spend. Optional because 0 is a legal cost
  // and "not reported" -- no database, or an unpriced model -- must stay
  // distinguishable from "spent nothing", the same rule every Usage field
  // follows.
  optional double cost_usd = 15;
  // max_cost is this child's spend cap, unset when it has none. Zero is a
  // legal cap ("spend nothing"), so this must stay optional the same way
  // SpawnRequest.max_cost is -- unset here means unlimited, matching
  // childstore.Session.MaxCost's zero-value convention, NOT "cap of zero".
  optional double max_cost = 16;
  // result is the script child's final result (SetResult), verbatim JSON.
  // Empty when the child has not set one — there is no separate presence bit
  // because a stored result is always non-empty (a JSON value has at least
  // one byte).
  string result = 17;
  // session_file is the child's on-disk session path (claude children),
  // empty for kinds that keep none.
  string session_file = 18;
  // exit_signal names the signal a signalled child died by, empty on a
  // normal exit-code exit.
  string exit_signal = 19;
  repeated string slash_commands = 20;
  // max_completion_tokens is the daemon's own model catalog's answer for
  // model, zero when the catalog has no entry — the same rule
  // ChildSummary.context_window follows.
  int32 max_completion_tokens = 21;
}

message ListChildrenRequest {
  // Empty means every child. Otherwise only children whose status matches one
  // of these values (protocol.Status strings).
  repeated string statuses = 1;
  // The remaining filters mirror protocol.ListFilter: exact name, substring
  // name/cwd, unix-ms age floor, AND-match labels (every k=v present) and
  // key-presence has_label.
  string name = 2;
  string name_contains = 3;
  string cwd_contains = 4;
  int64 since = 5;
  map<string, string> labels = 6;
  repeated string has_label = 7;
}

message ListChildrenResponse {
  repeated ChildSummary children = 1;
}

message GetChildRequest {
  string child_id = 1;
}

message GetChildResponse {
  ChildSummary child = 1;
}

// PrefillRead is one pre-fill entry; start/end are 1-based inclusive
// line numbers, 0 = open. See protocol.PrefillRead.
message PrefillRead {
  string path = 1;
  int32 start = 2;
  int32 end = 3;
}

// SpawnRequest is a deliberately NARROW slice of protocol.SpawnRequest — the
// fields a TUI sets. Everything else keeps its daemon-side default. Do not
// grow this into a full mirror without a consumer for each field.
message SpawnRequest {
  string cwd = 1;
  string name = 2;
  string model = 3;
  string kind = 4;
  map<string, string> labels = 5;
  string parent_child_id = 6;
  string executor_selector = 7;

  // ExecutorRef pins this spawn to one specific executor by its human-readable
  // machine label or raw id. See protocol.SpawnRequest.ExecutorRef.
  string executor_ref = 11;

  // Preset names a daemon-side preset (conversations.presets) that
  // Controller.Spawn resolves FIRST — it supplies kind, model, tools, prompt
  // and budgets. Empty = none.
  string preset = 12;

  // Files the child reads before its first turn (fundi only).
  repeated PrefillRead prefill = 13;

  // ScriptSpec, for kind = "script", names the pymodule that IS the child's
  // brain: a saved Python module run as the child's process, with a per-child
  // Connect socket as its control channel. The fundi/claude-only fields
  // above are refused on a script spawn, and prefill with them.
  message ScriptSpec {
    string repo = 1;
    string script = 2;
    repeated string modules = 3;
    repeated string args = 4;
  }
  ScriptSpec script = 14;

  // Fields 15-29 are OPERATOR-ONLY: Spawn refuses them with PermissionDenied when the caller has child provenance.
  // This is enforced as a child-ALLOWED set (fields 1-14, see verbs.go's
  // childAllowedSpawnFields), not a literal list of these 15 -- so a NEW
  // SpawnRequest field is OPERATOR-ONLY by default. Adding one requires an
  // explicit decision: either add its number to childAllowedSpawnFields (and
  // to this comment's child-allowed range) if a child should be able to set
  // it, or leave it unclassified and let TestSpawnRequestFieldsAreClassified
  // (pkg/connectapi/verbs_test.go) fail until it's placed in one bucket or
  // the other on purpose.
  //
  // thinking (17) and append_system_prompt (16) are labelled OPERATOR-ONLY
  // here as a Connect-WIRE policy, not a capability boundary: a child can
  // already set both through the tool plane (fundi/MCP agent_spawn, and any
  // preset it can name, including one it wrote itself) before this guard ever
  // runs. The wire guard exists to keep Connect at least as strict as the
  // framed plane, not to claim these two fields are otherwise unreachable.
  //
  // Types are mirrors of protocol.SpawnRequest (pkg/protocol/types.go); where
  // the plan sketch said bool but the Go field is a string (fork_session,
  // passthrough_auth), the Go type wins.
  string config_dir = 15;
  string append_system_prompt = 16;
  string thinking = 17;
  bool no_session = 18;
  string resume_session = 19;
  // fork_session is the session id to fork FROM, a string — not a bool.
  string fork_session = 20;
  repeated string extensions = 21;
  bool no_extensions = 22;
  bool verbose = 23;
  repeated string extra_args = 24;
  repeated string skills_dirs = 25;
  string mcp_config = 26;
  map<string, string> env = 27;
  bool record_requests = 28;
  // passthrough_auth is kind=claude's tri-state billing choice: empty/auto,
  // "on" or "off" — a string, never a bool.
  string passthrough_auth = 29;

  // The three budgets are optional because zero and unset differ, in OPPOSITE
  // directions per field: unset max_depth means 1 and zero means "may not
  // spawn"; unset max_cost means UNLIMITED and zero means "spend nothing";
  // unset max_children means 4. Collapsing any of them to a plain value
  // silently converts one meaning into the other.
  optional int32 max_depth = 8;
  optional double max_cost = 9;
  optional int32 max_children = 10;
}

message SpawnResponse {
  string child_id = 1;
}

message KillRequest {
  string child_id = 1;
  int64 shutdown_timeout_ms = 2;
  int64 kill_timeout_ms = 3;
}

// KillResponse mirrors protocol.KillResponseData, which is what
// Controller.Kill actually returns. Note it carries NO status field — the
// child's status is read separately via GetChild if a client wants it.
message KillResponse {
  string child_id = 1;
  // exit_code is optional: a signalled child has none, and 0 means clean exit.
  optional int32 exit_code = 2;
  string signal = 3;
  int64 duration_ms = 4;
  bool escalated = 5;
}

// CloseRequest finalizes a conversation: the child leaves the daemon's store
// and can never again be resumed, reattached or continued. Its transcript is
// NOT deleted — no foreign key references conversations.child, so
// conversation_message, event_log and conversation_turn all survive and stay
// readable through GetHistory.
//
// The child must already be exited; closing a live child is an error, not an
// implicit kill.
message CloseRequest {
  string child_id = 1;
}

message CloseResponse {
  string child_id = 1;
}

// SetBudgetRequest changes a child's MaxCost with OPERATOR authority: no
// lineage check (any child at any depth may be targeted) and no
// remaining-budget check against a parent's grant. max_cost is plain
// double, not optional -- unlike ChildSummary.max_cost, 0 here is an
// actively requested value ("make unlimited"), never an absent-field
// sentinel.
message SetBudgetRequest {
  string child_id = 1;
  double max_cost = 2;
}

message SetBudgetResponse {
  string child_id = 1;
  double max_cost = 2;
}

// TaskRow is one row of the task ledger. Handle is the dotted ordinal path
// ("2.1"), computed on read and never persisted -- an agent addresses tasks by
// handle so it never has to carry a UUID across turns.
message TaskRow {
  string handle = 1;
  string content = 2;
  string active_form = 3;
  string status = 4;
  string assignee = 5;
  string drop_reason = 6;
}

message ListTasksRequest {
  // Empty means every conversation, matching tasks.ListFilter.
  string conversation_id = 1;
  // include_dropped surfaces rows an agent decided not to do. Dropped rows are
  // hidden by default.
  bool include_dropped = 2;
  // The framed verb's remaining filter fields: tasks assigned to one child,
  // one status value, a row cap, and all (include dropped).
  string child_id = 3;
  string status = 4;
  int32 limit = 5;
  // all is the framed verb's include-dropped flag. Both spellings stay on
  // the wire; the handler treats include_dropped OR all set as
  // include-dropped.
  bool all = 6;
}

message ListTasksResponse {
  repeated TaskRow tasks = 1;
}

// ModelRow is one model the daemon can run, plus whatever its catalog knows
// about it. Every catalog field is optional because the daemon has NO catalog
// entry for a locally-served model (ollama, LM Studio, a custom provider), and
// "not reported" must stay distinguishable from a real zero — the same rule
// every Usage field follows. Collapsing any of them turns "never heard of this
// model" into "free, with a zero-token context window", which sorts every
// local model to the top of a cheapest-first list.
//
// Prices are USD PER TOKEN, exactly as OpenRouter reports them. A renderer
// multiplies by a million itself.
message ModelRow {
  string id       = 1;  // "provider/model", exactly as SpawnRequest.model
  string provider = 2;
  string model    = 3;
  string name     = 4;
  string source   = 5;  // user-config|builtin|alias|openrouter|local

  optional int32  context_window        = 6;
  optional int32  max_completion_tokens = 7;
  optional double prompt_usd            = 8;
  optional double completion_usd        = 9;
  optional double cache_read_usd        = 10;
  optional double cache_write_usd       = 11;

  // "text", "image", "file". EMPTY means the daemon has no catalog entry for
  // this id, NEVER "text only" — a text-only model reports ["text"]. A client
  // filtering on vision must surface unknowns rather than hide them, or it
  // silently hides every locally-served model.
  repeated string input_modalities = 12;

  // created is OpenRouter's LISTING date (unix seconds), not the model's
  // release date. They track closely enough to order by; the distinction
  // matters only if a client renders it as "released". Optional because a
  // locally-served model has no catalog entry and 0 is a legal timestamp.
  optional int64 created = 13;

  // supported_parameters is what the model accepts on a request. "tools" is
  // the one that decides whether it can be an agent at all.
  //
  // EMPTY means the daemon has no catalog entry, NEVER "supports nothing" --
  // the same rule input_modalities follows. A client filtering on tool support
  // must keep unknowns, or it hides every locally-served model.
  repeated string supported_parameters = 14;

  // expires_at is OpenRouter's expiration_date verbatim (YYYY-MM-DD), empty
  // when none. It is a FORWARD warning: OpenRouter delists a model rather than
  // leaving it listed and expired, so a date here is always in the future.
  // Some entries carry a far-future sentinel meaning "no planned removal", so
  // a renderer must bound how far ahead it warns.
  string expires_at = 15;

  // knowledge_cutoff is when the model's training data ends (YYYY-MM-DD),
  // empty when the catalog does not report it (57% of entries, and every
  // locally-served model). A DIFFERENT axis from created: a model listed last
  // week can have a cutoff from a year before that.
  string knowledge_cutoff = 16;

  // agentic_index is a third-party score for agentic capability, absent for
  // 62% of the catalog. It is a CLAIM, not a guarantee -- present it as what
  // the catalog reports, never as a promise, and never let absence read as a
  // low score.
  optional double agentic_index = 17;

  // The other two artificial_analysis scores. All three are present for
  // exactly the same entries -- a row with one has all three -- and carry the
  // same caveat: a third-party claim, absent for most of the catalog, and
  // absence must never read as a low score.
  optional double intelligence_index = 18;
  optional double coding_index       = 19;
}

message ListModelsRequest {
  string provider = 1;  // empty = every provider
  // kind scopes which sources can answer: a "claude" child resolves only
  // Anthropic ids, so offering it an OpenRouter id produces a child that
  // spawns, attaches and never answers. Empty means the fundi default.
  string kind = 2;
}

message ListModelsResponse {
  repeated ModelRow models = 1;
}

// ConversationSearchRequest mirrors insights.SearchFilter. It carries a
// caller-chosen OWNER FILTER (widens nothing -- the daemon ANDs its own
// server-derived scope on top, per docs/plans/2026-09-12-conversation-query-
// layer-design.md §3: scope is never on the wire).
message ConversationSearchRequest {
  optional int64 since_unix = 1;
  optional int64 until_unix = 2;
  string owner      = 3;
  string persona    = 4;
  string source     = 5;
  string model      = 6;
  string status     = 7;
  string path       = 8;  // "" | "proxy" | "direct"
  int64  min_tokens = 9;
  string text       = 10;
  int32  limit      = 11; // 0 = default; server clamps to a max
}

message ConversationSummary {
  string id       = 1;
  string name     = 2;
  string owner    = 3;
  string persona  = 4;
  string source   = 5;
  string model    = 6;
  string status   = 7;
  string driven_by = 8;
  int64  created_at_unix = 9;
  int32  turns = 10;
  int64  input_tokens = 11;
  int64  output_tokens = 12;
  int64  cache_read_tokens = 13;
  double cache_hit_ratio = 14;
  double total_cost_usd = 15;
  string first_message = 16;
}

message ConversationSearchResponse {
  repeated ConversationSummary rows = 1;
}

message ConversationExportRequest {
  string conversation_id = 1;
}

message TranscriptTurn {
  int32  ordinal = 1;
  string role = 2;
  bytes  content = 3; // verbatim JSON content-block array
  repeated string skills = 4;
  // Metrics are unset when not reported (a message with no turn row, e.g. a
  // user or pre-fill row, or a NULL column); zero is a measured zero.
  optional int64 input_tokens = 5;
  optional int64 output_tokens = 6;
  optional int64 cache_read_tokens = 7;
  optional int32 latency_ms = 8;
  string model = 9;
  string prefix_hash = 10;
  // The OpenRouter provider that served the turn (e.g. "Together"); empty
  // when not reported (native Anthropic, no turn row, or pre-column turns).
  string served_provider = 11;
}

message ConversationExportResponse {
  string conversation_id = 1;
  string owner = 2;
  string persona = 3;
  string source = 4;
  string driven_by = 5;
  repeated TranscriptTurn turns = 6;
  repeated string available_skills = 7;
}

// ConversationQueryRequest names one catalogue query and carries the same
// StatsFilter shape ConversationSearchRequest mirrors SearchFilter with.
// Scope is never on the wire (see docs/plans/2026-09-12-conversation-query-
// layer-design.md §3) -- the daemon derives it from the caller's own
// authenticated identity.
message ConversationQueryRequest {
  string name = 1; // "tools" | "skills" | "classes" | "models" | "sizes" | "coverage"
  optional int64 since_unix = 2;
  optional int64 until_unix = 3;
  string owner   = 4;
  string persona = 5;
  string source  = 6;
  string model   = 7;
  string path    = 8; // "" | "proxy" | "direct"
}

// QueryColumn declares one column's name and value kind. kind is one of
// "string" | "int" | "float"; format is a rendering hint only ("" | "usd" |
// "pct"), never interpreted by anything that isn't formatting for display.
message QueryColumn {
  string name   = 1;
  string kind   = 2;
  string format = 3;
}

// QueryValue carries exactly one of its three fields, selected by the
// corresponding QueryColumn.kind at the same position in the row.
message QueryValue {
  oneof v {
    string str_value = 1;
    int64 int_value = 2;
    double float_value = 3;
  }
}

message QueryRow {
  repeated QueryValue cells = 1;
}

message ConversationQueryResponse {
  repeated QueryColumn columns = 1;
  repeated QueryRow rows = 2;
}

enum ReviewStage {
  REVIEW_STAGE_UNSPECIFIED = 0; // defaults to detect
  REVIEW_STAGE_DETECT = 1;
  REVIEW_STAGE_RANK = 2; // persists findings
}

enum ReviewAcceptStatus {
  REVIEW_ACCEPT_STATUS_UNSPECIFIED = 0;
  REVIEW_ACCEPT_STATUS_ENQUEUED = 1;
  REVIEW_ACCEPT_STATUS_ALREADY_RUNNING = 2;
  REVIEW_ACCEPT_STATUS_QUEUE_FULL = 3;
}

// ConversationReviewRequest never carries a scope -- see ConversationQueryRequest's
// comment above for why. An id outside the caller's scope is dropped from
// ConversationReviewResponse.accepted silently, never reported as a distinct
// status: surfacing it would confirm the id exists to a caller who cannot
// read it.
message ConversationReviewRequest {
  repeated string conversation_ids = 1;
  ReviewStage stage = 2;
  optional string model = 3;
  optional string profile = 4;
  optional double budget_usd = 5;
  optional int32 min_turns = 6;
  optional bool force = 7;
}

message ConversationReviewAccept {
  string conversation_id = 1;
  ReviewAcceptStatus status = 2;
}

// ConversationReviewResponse is deliberately thin: one status per requested
// conversation_id, nothing else. No analysis id, no run state -- read those
// back through ConversationFindings. The verb never blocks on an LLM call.
message ConversationReviewResponse {
  repeated ConversationReviewAccept accepted = 1;
}

message ConversationFindingsRequest {
  string axis = 1;
  string skill = 2;
  string status = 3; // "" means "open", matching store.ListFindings
  repeated string conversation_ids = 4; // optional narrowing; scope still applies
  int32 limit = 5;
}

message ReviewFinding {
  string id = 1;
  string analysis_id = 2;
  string conversation_id = 3;
  string axis = 4;
  string topic_key = 5;
  string skill_name = 6;
  string title = 7;
  int64 expected_savings_tokens = 8;
  string status = 9;
}

message ReviewAnalysis {
  string id = 1;
  string conversation_id = 2;
  string model = 3;
  string profile = 4;
  string status = 5; // ok | failed
  string error = 6;
  int64 input_tokens = 7;
  int64 output_tokens = 8;
  double cost_usd = 9;
  int64 created_at_unix = 10;
}

message ConversationFindingsResponse {
  repeated ReviewFinding findings = 1;
  repeated ReviewAnalysis analyses = 2;
}

// ExecutorRow is one executor the daemon's pool currently knows about, plus
// whether it could serve a spawn of a given kind right now.
//
// Only LIVE (currently connected) executors are listed — an offline durable
// executor cannot serve a fresh spawn either, so this mirrors exactly what a
// spawn attempt would see, not the full management-table view `rafiki
// executor list` shows.
message ExecutorRow {
  string id = 1;
  // machine is the human-readable name an operator gave this executor
  // (Labels["machine"]), empty when it has none (e.g. a fleet executor
  // selected purely by other labels).
  string machine = 2;
  map<string, string> labels = 3;
  string isolation = 4;
  string workspace_mode = 5;
  repeated string roots = 6;
  string admits = 7;
  bool enabled = 8;
  bool connected = 9;
  // launch_kinds is what this executor self-reported at connect time it will
  // launch (e.g. "claude"). Empty means it hosts no launchable child kind.
  repeated string launch_kinds = 10;
  // eligible and reason are populated only when the request's kind was
  // non-empty: eligible mirrors exactly what chooseExecutor/
  // chooseLaunchExecutor would decide for a fresh top-level spawn of that
  // kind by this caller, and reason names the exclusion when eligible is
  // false. Never true FILTER these rows itself — the CLI/TUI decide what to
  // do with an ineligible row (show it greyed out, exclude it from a count).
  bool eligible = 11;
  string reason = 12;
}

message ListExecutorsRequest {
  // kind scopes eligibility: "claude" checks launch-kind support, "fundi"
  // checks only admission/workspace-mode, matching chooseExecutor vs
  // chooseLaunchExecutor.
  //
  // kind empty = plain listing, eligibility unevaluated (eligible/reason unset).
  string kind = 1;

  // selector filters rows by label selector; limit caps them (0 = default).
  string selector = 2;
  int32 limit = 3;
}

message ListExecutorsResponse {
  repeated ExecutorRow rows = 1;
}

// ─── Daraja RPCs ─────────────────────────────────────────────────────────────
// The three Daraja RPCs break the daraja's bidirectional Relay stream into
// HTTP/1.1-compatible operations: unary send plus server-streaming watch.
// None of them may be bidi — the remote plane is HTTP/1.1 and connect-go
// refuses bidi below HTTP/2.

// DarajaLaunch selects an executor that admits the request's label selector
// AND declares "claude" among its LaunchKinds, launches a daraja there, and
// waits for the daraja's reverse dial through the pool. A match that yields
// zero candidates is refused with a diagnostic naming the excluding predicate
// per candidate (explainNoMatch shape).
//
// The launch uses the daemon's internal AdminService on the resolved executor
// to start daraja. The daraja then reverse-dials back to the pool, where it
// is accepted once its ticket authenticates. This method blocks until that
// connection arrives.
message DarajaLaunchRequest {
  // label_selector over executor labels. Intersected with the executor's own
  // admission rules; both must match or the launch is refused.
  string executor_selector = 1;
  // cwd for the hosted child process. Passed verbatim to AdminService.Launch.
  string cwd = 2;
  // ChildSpec (typed) so the executor and daraja both build the child's argv
  // through pkg/claudeargv instead of each side inventing one.
  rafiki.daraja.v1.ChildSpec spec = 3;
  // resume_session (optional) for a claude child to continue an existing
  // session. Absent means a fresh session.
  optional string resume_session = 4;
}

message DarajaLaunchResponse {
  string child_id = 1;
  int32 pid = 2;
  int32 pgid = 3;
  // connected_unix_ms marks when the daraja completed its reverse dial and
  // the pool registered the connection.
  int64 connected_unix_ms = 4;
}

// DarajaSend writes bytes to a live child's stdin via the connected daraja.
// Unary rather than a bidi half because the HTTP/1.1 remote plane cannot
// carry the BidirectionalRelay that the in-process daraja service uses.
message DarajaSendRequest {
  string child_id = 1;
  bytes data = 2;
}

message DarajaSendResponse {
  bool acknowledged = 1;
}

// DarajaWatch streams stdout and lifecycle markers from a connected daraja.
// Server-streaming only (no client messages) because HTTP/1.1 remote plane
// splits bidirectional relay into separate send + watch verbs.
//
// Events include ProcessRestarted (pid change after restart) and ProcessExited
// (exit_code, signal). These let a caller distinguish normal output from
// process-boundary events that reset any per-process consumer state.
message DarajaWatchRequest {
  string child_id = 1;
}

message DarajaWatchResponse {
  oneof event {
    bytes stdout = 1;
    DarajaProcessRestarted restarted = 2;
    DarajaProcessExited exited = 3;
  }
}

message DarajaProcessRestarted {
  int32 pid = 1;
}

message DarajaProcessExited {
  int32 exit_code = 1;
  string signal = 2;
}

// RateLimitWindow is one Anthropic subscription rate-limit window's snapshot
// (the "5h" or "7d" family of anthropic-ratelimit-unified-* headers).
// utilization and reset_at are optional because a header Anthropic omits, or
// sends in an unrecognized shape, must stay distinguishable from a real zero
// or a real timestamp.
message RateLimitWindow {
  optional double utilization = 1; // Anthropic's own units, passed through verbatim
  optional int64 reset_at = 2;     // unix seconds
  string status = 3;               // "" = not reported
}

message GetRateLimitStatusRequest {}

// GetRateLimitStatusResponse answers the CALLER's own latest captured
// snapshot -- never an arbitrary user's, which is why the request carries no
// id. A NotFound response (not an empty message) means this user has never
// made an OAuth-passthrough call; that is expected for anyone who has not
// used `rafiki claude --passthrough-auth`, not an error.
message GetRateLimitStatusResponse {
  string organization_id = 1;
  RateLimitWindow five_h = 2;
  RateLimitWindow seven_d = 3;
  string overall_status = 4;
  int64 updated_at = 5; // unix seconds
}

service Control {
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse);
  rpc StreamEvents(StreamEventsRequest) returns (stream Event);
  rpc Send(SendRequest) returns (SendResponse);
  rpc ListChildren(ListChildrenRequest) returns (ListChildrenResponse);
  rpc GetChild(GetChildRequest) returns (GetChildResponse);
  rpc Spawn(SpawnRequest) returns (SpawnResponse);
  rpc Kill(KillRequest) returns (KillResponse);
  rpc Close(CloseRequest) returns (CloseResponse);
  rpc SetBudget(SetBudgetRequest) returns (SetBudgetResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc ListExecutors(ListExecutorsRequest) returns (ListExecutorsResponse);
  rpc GetRateLimitStatus(GetRateLimitStatusRequest) returns (GetRateLimitStatusResponse);
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);
  rpc GetSkill(GetSkillRequest) returns (GetSkillResponse);
  rpc UpsertSkill(UpsertSkillRequest) returns (UpsertSkillResponse);
  rpc DeleteSkill(DeleteSkillRequest) returns (DeleteSkillResponse);
  rpc SetSkillEnabled(SetSkillEnabledRequest) returns (SetSkillEnabledResponse);
  rpc ListPymodules(ListPymodulesRequest) returns (ListPymodulesResponse);
  rpc GetPymodule(GetPymoduleRequest) returns (GetPymoduleResponse);
  rpc PutPymodule(PutPymoduleRequest) returns (PutPymoduleResponse);
  rpc DeletePymodule(DeletePymoduleRequest) returns (DeletePymoduleResponse);
  rpc AddPymoduleGitSource(AddPymoduleGitSourceRequest) returns (AddPymoduleGitSourceResponse);
  rpc ListPymoduleGitSources(ListPymoduleGitSourcesRequest) returns (ListPymoduleGitSourcesResponse);
  rpc RefreshPymoduleGitSource(RefreshPymoduleGitSourceRequest) returns (RefreshPymoduleGitSourceResponse);
  rpc RemovePymoduleGitSource(RemovePymoduleGitSourceRequest) returns (RemovePymoduleGitSourceResponse);
  rpc ListPresets(ListPresetsRequest) returns (ListPresetsResponse);
  rpc GetPreset(GetPresetRequest) returns (GetPresetResponse);
  rpc PutPreset(PutPresetRequest) returns (PutPresetResponse);
  rpc DeletePreset(DeletePresetRequest) returns (DeletePresetResponse);
  // Recall serves conversation-derived hits and curated memories for the
  // calling identity: the manager implementation resolves Scope/owner from
  // the request context, so no request field carries them.
  rpc Recall(RecallRequest) returns (RecallResponse);
  rpc RecallContext(RecallContextRequest) returns (RecallContextResponse);
  rpc GetMemory(GetMemoryRequest) returns (GetMemoryResponse);
  rpc MemoryTree(MemoryTreeRequest) returns (MemoryTreeResponse);
  rpc PutMemory(PutMemoryRequest) returns (PutMemoryResponse);
  rpc DeleteMemory(DeleteMemoryRequest) returns (DeleteMemoryResponse);
  rpc RecallBackfill(RecallBackfillRequest) returns (RecallBackfillResponse);
  rpc RecallStatus(RecallStatusRequest) returns (RecallStatusResponse);
  rpc ConversationSearch(ConversationSearchRequest) returns (ConversationSearchResponse);
  rpc ConversationExport(ConversationExportRequest) returns (ConversationExportResponse);
  rpc ConversationQuery(ConversationQueryRequest) returns (ConversationQueryResponse);
  rpc ConversationReview(ConversationReviewRequest) returns (ConversationReviewResponse);
  rpc ConversationFindings(ConversationFindingsRequest) returns (ConversationFindingsResponse);
  rpc DarajaLaunch(DarajaLaunchRequest) returns (DarajaLaunchResponse);
  rpc DarajaSend(DarajaSendRequest) returns (DarajaSendResponse);
  rpc DarajaWatch(DarajaWatchRequest) returns (stream DarajaWatchResponse);
  // Provider bans exclude OpenRouter providers from routing. List shows the
  // cache guard's automatic ejections alongside operator bans; Ban and Unban
  // manage operator bans only and require an admin user credential (or the
  // anonymous local socket).
  rpc ListProviderBans(ListProviderBansRequest) returns (ListProviderBansResponse);
  rpc BanProvider(BanProviderRequest) returns (BanProviderResponse);
  rpc UnbanProvider(UnbanProviderRequest) returns (UnbanProviderResponse);
  // The script-child verbs. All three are childScoped; Report is the one that
  // acts OUTWARD (on the caller's own parent), Receive and SetResult act only
  // on the caller itself. See the "Script children" block above for the
  // authorization and size-cap rules.
  rpc Report(ReportRequest) returns (ReportResponse);
  rpc Receive(ReceiveRequest) returns (stream ScriptMessage);
  rpc SetResult(SetResultRequest) returns (SetResultResponse);
  // ─── Framed-protocol retirement RPCs ─────────────────────────────────────
  // The Connect faces of the framed ctrl_* verbs the retirement moves over.
  // Wave 2 fills the handlers; until then they answer Unimplemented.
  rpc Resume(ResumeRequest) returns (ResumeResponse);
  rpc CloseAllExited(CloseAllExitedRequest) returns (CloseAllExitedResponse);
  rpc SetLabels(SetLabelsRequest) returns (SetLabelsResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc ShutdownDaemon(ShutdownDaemonRequest) returns (ShutdownDaemonResponse);
  rpc ModelInfo(ModelInfoRequest) returns (ModelInfoResponse);
  rpc ConversationStats(ConversationStatsRequest) returns (ConversationStatsResponse);
  rpc EnrollExecutor(EnrollExecutorRequest) returns (EnrollExecutorResponse);
  rpc CreateExecutor(CreateExecutorRequest) returns (CreateExecutorResponse);
  rpc LabelExecutor(LabelExecutorRequest) returns (LabelExecutorResponse);
  rpc DisableExecutor(DisableExecutorRequest) returns (DisableExecutorResponse);
  rpc EnableExecutor(EnableExecutorRequest) returns (EnableExecutorResponse);
  rpc DeleteExecutor(DeleteExecutorRequest) returns (DeleteExecutorResponse);
  // The first message is ready. The stream stays open for the session's
  // lifetime; the daemon evicts a transient executor when the stream ends.
  rpc ExecutorSession(ExecutorSessionRequest) returns (stream ExecutorSessionEvent);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc RemoveUser(RemoveUserRequest) returns (RemoveUserResponse);
  rpc GetStreams(GetStreamsRequest) returns (GetStreamsResponse);
  // A raw child-protocol frame, for debugging/scripting. userOnly: children
  // use Send.
  rpc SendFrame(SendFrameRequest) returns (SendFrameResponse);
}

// SkillRow is one row of conversations.skills. body is omitted from list
// responses: an inventory is a handful of lines and a body is a document.
message SkillRow {
  string namespace = 1;
  string name = 2;
  string description = 3;
  string source = 4;
  bool enabled = 5;
  string shadowed_core_version = 6;
  string updated_at = 7;
  // body is populated only by GetSkill.
  string body = 8;
}

message ListSkillsRequest {
  // include_disabled returns rows an operator switched off as well.
  bool include_disabled = 1;
}
message ListSkillsResponse { repeated SkillRow rows = 1; }

message GetSkillRequest {
  string namespace = 1;
  string name = 2;
}
message GetSkillResponse { SkillRow row = 1; }

message UpsertSkillRequest {
  // namespace defaults to "rafiki" when empty.
  string namespace = 1;
  string name = 2;
  string description = 3;
  string body = 4;
  // source defaults to "manual" when empty. "rafiki-core" is REJECTED: that
  // provenance belongs to the daemon's own startup sync.
  string source = 5;
  string shadowed_core_version = 6;
}
message UpsertSkillResponse { SkillRow row = 1; }

message DeleteSkillRequest {
  string namespace = 1;
  string name = 2;
}
message DeleteSkillResponse {}

message SetSkillEnabledRequest {
  string namespace = 1;
  string name = 2;
  bool enabled = 3;
}
message SetSkillEnabledResponse {}

// PymoduleRow is one row of conversations.pymodules in the caller's own
// owner bucket. The owner is never a field: the daemon resolves it from the
// request context, the same identity the caller's own children use.
message PymoduleRow {
  int64 version = 1;     // the row id: two saves under one name are two versions
  string name = 2;
  string description = 3;
  string created_at = 4; // RFC3339
  // code is populated only by GetPymodule and PutPymodule; list responses
  // omit it -- an inventory is not a document.
  string code = 5;
  // repo names the scope the row came from: "local" for the blob store
  // (every row that predates git sources), otherwise the name of the git
  // source the module was discovered in.
  string repo = 6;
}

message ListPymodulesRequest {
  // repo is an optional scope filter: empty lists every pymodule the caller
  // owns across all scopes, "local" the blob-store rows only, otherwise the
  // named git source's discovered inventory.
  string repo = 1;
}
message ListPymodulesResponse { repeated PymoduleRow rows = 1; }

message GetPymoduleRequest { string name = 1; }
message GetPymoduleResponse { PymoduleRow row = 1; }

message PutPymoduleRequest {
  string name = 1;
  string code = 2;
  // description defaults to "" when omitted.
  string description = 3;
}
message PutPymoduleResponse { PymoduleRow row = 1; }

message DeletePymoduleRequest { string name = 1; }
message DeletePymoduleResponse {}

// GitSourceRow is one registered git source: the human label used as the
// `repo` argument everywhere, plus the url and ref it was registered with.
message GitSourceRow {
  string name = 1;
  string url = 2;
  string ref = 3;
}

message AddPymoduleGitSourceRequest {
  // name is the human label, and must not be "local": that name is reserved
  // for the blob store, and a git source registered under it would make
  // repo="local" ambiguous.
  string name = 1;
  string url = 2;
  string ref = 3;
}
message AddPymoduleGitSourceResponse { GitSourceRow row = 1; }

message ListPymoduleGitSourcesRequest {}
message ListPymoduleGitSourcesResponse { repeated GitSourceRow rows = 1; }

message RefreshPymoduleGitSourceRequest { string name = 1; }

// GitSourceScript and GitSourcePackage deliberately duplicate the executor
// protocol's messages of the same names rather than importing across the two
// proto packages: the daemon-client wire format and the daemon-executor wire
// format stay dependency-free on each other.
message GitSourceScript {
  string name = 1;
  string description = 2;
}
message GitSourcePackage {
  string name = 1;
  string description = 2;
}

message RefreshPymoduleGitSourceResponse {
  repeated GitSourceScript scripts = 1;
  repeated GitSourcePackage packages = 2;
  bool venv_ready = 3;
  string venv_error = 4;
}

message RemovePymoduleGitSourceRequest { string name = 1; }
message RemovePymoduleGitSourceResponse {}

// StringList wraps a repeated string so a preset allowlist can be ABSENT
// (unset: the kind's default), PRESENT-AND-EMPTY (none), or a list --
// proto3 cannot mark a repeated field optional, and collapsing the first two
// turns "all tools" into "no tools".
message StringList { repeated string items = 1; }

message PresetRow {
  int64 version = 1;
  string name = 2;
  string description = 3;
  string kind = 4;
  string provider = 5;
  string model = 6;
  string thinking = 7;
  string executor = 8;
  map<string, string> labels = 9;
  StringList tools = 10;
  StringList skills = 11;
  StringList mcp_servers = 12;
  optional bool context_files = 13;
  string system_prompt = 14;
  string append_system_prompt = 15;
  optional double max_cost = 16;
  optional int32 max_depth = 17;
  optional int32 max_children = 18;
  string written_by_child = 19;
  string created_at = 20; // RFC3339
  string deleted_at = 21; // RFC3339; empty when live
}

message ListPresetsRequest { string prefix = 1; }
message ListPresetsResponse { repeated PresetRow rows = 1; }
message GetPresetRequest { string name = 1; bool history = 2; }
message GetPresetResponse { repeated PresetRow rows = 1; }
message PutPresetRequest { PresetRow preset = 1; }
message PutPresetResponse { PresetRow preset = 1; }
message DeletePresetRequest { string name = 1; }
message DeletePresetResponse {}

message RecallHit {
  string id = 1; string source = 2; string snippet = 3;
  // when is RFC3339 (UTC).
  string when = 4;
  string conversation_id = 5; string conversation_name = 6;
  string repo = 7; string kind = 8;
  int32 ordinal_from = 9; int32 ordinal_to = 10;
  string path = 11; string name = 12;
  string title = 13; double score = 14;
}

message RecallRequest {
  string query = 1;
  // sources filters the indexes searched: "memory", "summary", "window";
  // empty means all three.
  repeated string sources = 2;
  string under = 3;   // ltree path prefix for memories; "" = all
  string repo = 4;    // basename match for conversation sources; "" = all
  int64 since_unix = 5;  // unix seconds; 0 = unbounded
  int64 until_unix = 6;  // unix seconds; 0 = unbounded
  int32 limit = 7;    // 0 = default (10), clamped to 50
}
message RecallResponse { repeated RecallHit hits = 1; }

message RecallContextRequest {
  string id = 1;      // hit id ("m:", "s:" or "w:" prefixed)
  int32 before = 2;
  int32 after = 3;
  int32 max_chars = 4;
}
message RecallContextResponse { string text = 1; }

message MemoryRow {
  string id = 1;
  string path = 2;
  string name = 3;
  string body = 4;
  string meta_json = 5;
  string created_at = 6; // RFC3339 (UTC)
  string updated_at = 7; // RFC3339 (UTC)
}
message GetMemoryRequest {
  string path = 1;
  string name = 2;
}
message GetMemoryResponse { MemoryRow memory = 1; }
message MemoryTreeRequest {
  string path = 1;
  int32 depth = 2;
}
message MemoryTreeResponse { repeated MemoryRow memories = 1; }
message PutMemoryRequest {
  string path = 1;
  string name = 2;
  string body = 3;
  string meta_json = 4; // must be valid JSON; empty means "{}"
}
message PutMemoryResponse { MemoryRow memory = 1; }
message DeleteMemoryRequest {
  string path = 1;
  string name = 2;
}
message DeleteMemoryResponse {}

message RecallBackfillRequest {
  int64 since_unix = 1; // unix seconds
  double max_cost_usd = 2;
}
message RecallBackfillResponse {}

message RecallStatusRequest {}
message RecallStatusResponse {
  int64 conversations = 1;
  int64 windows = 2;
  int64 windows_unembedded = 3;
  int64 summaries = 4;
  int64 summaries_pending = 5;
  int64 memories = 6;
  double summary_cost_usd = 7;
  string backfill_since = 8; // RFC3339 (UTC); empty when backfill is off
  double backfill_budget_usd = 9;
  double backfill_spent_usd = 10;
  string embedding_model = 11;
  string summary_model = 12;
}

// ProviderBan is one live exclusion of an OpenRouter provider from routing:
// an operator ban (reason "operator", model_line "*" = every model line) or a
// cache-guard ejection (reason "no_cache", scoped to one model line).
message ProviderBan {
  string provider = 1;           // OpenRouter slug ("openinference"); a guard ejection may carry the display name
  string model_line = 2;
  string reason = 3;
  int64 created_at = 4;          // unix seconds
  optional int64 expires_at = 5; // unix seconds; absent = until lifted
  string note = 6;
}

message ListProviderBansRequest {}
message ListProviderBansResponse {
  repeated ProviderBan bans = 1;
  // persistent is false when the daemon has no ejection log: bans then last
  // only until it restarts.
  bool persistent = 2;
}

// BanProviderRequest bans provider from every model line. Banning an
// already-banned provider replaces its expiry and note.
message BanProviderRequest {
  string provider = 1;
  // Absent = until lifted. Present must be > 0: a zero-length ban is a
  // mistake, not a request.
  optional int64 duration_seconds = 2;
  string note = 3;
}
message BanProviderResponse {
  ProviderBan ban = 1;
  bool persistent = 2;
}

// UnbanProviderRequest lifts an operator ban. It does not clear the cache
// guard's own ejections of the same provider. NotFound when no operator ban is
// live.
message UnbanProviderRequest { string provider = 1; }
message UnbanProviderResponse {}

// ─── Framed-protocol retirement messages ───────────────────────────────────
// The request/response shapes behind the RPCs above that replace the framed
// ctrl_* verbs. Unless a comment says otherwise, each message mirrors its
// protocol.X counterpart (pkg/protocol/types.go) one Go field per proto
// field, in declaration order, skipping the framed envelope's Type and ID
// fields.

// ResumeRequest mirrors protocol.ResumeRequest: re-spawn an exited child
// against its persisted state record. api_key is used at spawn time only and
// is never persisted.
message ResumeRequest {
  string child_id = 1;
  string api_key = 2;
}

message ResumeResponse {
  string child_id = 1;
}

// CloseAllExitedRequest mirrors protocol.ForgetAllExitedRequest.
// older_than_ms filters by age; zero means all exited entries.
message CloseAllExitedRequest {
  int64 older_than_ms = 1;
}

// CloseAllExitedResponse lists the ids of the children that were closed, in
// close order, so a consumer can record exactly what was closed.
message CloseAllExitedResponse {
  repeated string child_ids = 1;
}

// SetLabelsRequest mirrors protocol.SetLabelsRequest: set entries apply
// first, then remove entries are deleted. Keys using the rafiki/ prefix are
// reserved and rejected.
message SetLabelsRequest {
  string child_id = 1;
  map<string, string> set = 2;
  repeated string remove = 3;
}

// SetLabelsResponse carries the full post-mutation map.
message SetLabelsResponse {
  map<string, string> labels = 1;
}

message StatusRequest {}

// StatusResponse mirrors protocol.StatusResponseData.
message StatusResponse {
  string version = 1;
  // started_at is unix ms, the daemon process's start time
  // (Controller.startedAt.UnixMilli).
  int64 started_at = 2;
  ChildCounts children = 3;
  int64 memory_bytes = 4;
  string socket = 5;
  string logs_dir = 6;

  // ChildCounts breaks down live vs exited child totals, mirroring
  // protocol.ChildCounts.
  message ChildCounts {
    int32 live = 1;
    int32 exited = 2;
  }
}

// SearchRequest mirrors protocol.SearchRequest: in-memory content search
// across children's sessions.
message SearchRequest {
  string query = 1;
  bool regex = 2;
  int32 limit = 3;
  int32 context = 4;
  // session_filter narrows which children are scanned; absent means every
  // child.
  SearchSessionFilter session_filter = 5;

  // SearchSessionFilter mirrors protocol.SearchSessionFilter. Labels is an
  // AND-match (every k=v present); HasLabel tests key presence only.
  message SearchSessionFilter {
    string cwd_contains = 1;
    string name_contains = 2;
    // since is unix ms, compared against each child's StartedAt.UnixMilli
    // (matchesSessionFilter); 0 means unbounded.
    int64 since = 3;
    map<string, string> labels = 4;
    repeated string has_label = 5;
  }
}

// SearchResponse mirrors protocol.SearchResponseData.
message SearchResponse {
  repeated SearchHit hits = 1;
  int32 total_hits = 2;
  int32 scanned = 3;
  // elapsed is ms (time.Since(start).Milliseconds() in Controller.Search).
  int64 elapsed = 4;

  // SearchHit mirrors protocol.SearchHit: one content match.
  message SearchHit {
    string child_id = 1;
    string session_file = 2;
    string session_id = 3;
    string session_name = 4;
    string entry_id = 5;
    // timestamp is unix ms, the ring event's own Timestamp (pkg/ring).
    int64 timestamp = 6;
    string role = 7;
    string snippet = 8;
    int32 match_start = 9;
    int32 match_end = 10;
  }
}

message ShutdownDaemonRequest {}
message ShutdownDaemonResponse {}

// ModelInfoRequest asks the daemon what it knows about one model, so the
// client need not read the OpenRouter catalog itself.
message ModelInfoRequest {
  string model = 1;
}

// ModelInfoResponse mirrors protocol.ModelInfoResponseData. known=false means
// "the daemon has no entry for this model" — an ordinary answer, not an
// error: every caller degrades by leaving the model's own defaults alone.
message ModelInfoResponse {
  string model = 1;
  string resolved_id = 2;
  int32 context_window = 3;
  int32 max_completion_tokens = 4;
  int32 auto_compact_window = 5;
  bool known = 6;
}

// ConversationStatsRequest mirrors protocol.ConversationStatsRequest: global
// (filtered) stats when conversation_id is empty, scoped to one conversation
// otherwise — in which case the filter fields are ignored. since_unix and
// until_unix are Unix seconds; 0 means unbounded.
message ConversationStatsRequest {
  string conversation_id = 1;
  int64 since_unix = 2;
  int64 until_unix = 3;
  string owner = 4;
  string persona = 5;
  string source = 6;
  string model = 7;
  string path = 8;
}

message ConversationStatsResponse {
  // The daemon's insights.Stats marshalled with encoding/json, opaque by
  // design (precedent: ToolUse.input_json).
  string stats_json = 1;
}

// ─── Executor admin verbs (ctrl_executor_enroll/create/label/disable/enable/delete) ───

// EnrollExecutorRequest mirrors protocol.ExecutorEnrollRequest: mint a
// one-time enrollment token.
message EnrollExecutorRequest {
  // name is the name of the MACHINE the executor will run on, which is not
  // necessarily the one that minted the token: the daemon writes it to the
  // `machine` trust label. It cannot be sent as a label.
  string name = 1;
  // labels are the operator's own trust labels. `owner` and `machine` are
  // written by the daemon (from the connection and from name); a request
  // carrying either key is REFUSED rather than silently overwritten.
  map<string, string> labels = 2;
  repeated string roots = 3;
  string isolation = 4;
  string workspace_mode = 5;
  string admits = 6;
  int64 ttl_seconds = 7;
}

// EnrollExecutorResponse mirrors protocol.ExecutorEnrollResponseData.
message EnrollExecutorResponse {
  string token = 1;
}

// CreateExecutorRequest mirrors protocol.ExecutorCreateRequest: mint an
// executor row and its durable credential in one step, with no enrollment
// handshake. Same label rules as EnrollExecutorRequest.
message CreateExecutorRequest {
  string name = 1;
  map<string, string> labels = 2;
  repeated string roots = 3;
  string isolation = 4;
  string workspace_mode = 5;
  string admits = 6;
}

// CreateExecutorResponse mirrors protocol.ExecutorCreateResponseData. The
// credential is shown ONCE; only its hash is stored.
message CreateExecutorResponse {
  string executor_id = 1;
  string credential = 2;
}

// LabelExecutorRequest mirrors protocol.ExecutorLabelRequest: set or remove
// labels on an executor's database row.
message LabelExecutorRequest {
  string executor_id = 1;
  map<string, string> set = 2;
  repeated string remove = 3;
}

message LabelExecutorResponse {
  ExecutorRow executor = 1;
}

// DisableExecutorRequest disables an executor. Its credential stops working.
message DisableExecutorRequest { string executor_id = 1; }
message DisableExecutorResponse {}

// EnableExecutorRequest re-enables a disabled executor.
message EnableExecutorRequest { string executor_id = 1; }
message EnableExecutorResponse {}

// DeleteExecutorRequest permanently removes an executor row. Unlike disable,
// this cannot be undone.
message DeleteExecutorRequest { string executor_id = 1; }
message DeleteExecutorResponse {}

// ExecutorSessionRequest mirrors protocol.ExecutorSessionRequest: ask the
// daemon for an executor row belonging to the caller's own machine, so the
// client can serve its operator's filesystem as a workspace. It carries only
// fields that do NOT gate access — owner, isolation, workspace_mode and
// admits are all decided by the daemon from the connection, because a client
// that names them can grant itself anything.
message ExecutorSessionRequest {
  // name is the operator-chosen name of the client's machine, so the daemon
  // can find a durable executor that shares this filesystem. It does NOT
  // gate access — owner and admits are still derived from the connection.
  string name = 1;
  // roots describes the directories this machine offers, for humans and for
  // selectors. Nothing enforces them and nothing may imply it does.
  repeated string roots = 2;
}

// ExecutorSessionEvent is the one message shape the ExecutorSession stream
// sends.
message ExecutorSessionEvent {
  oneof event {
    ExecutorSessionReady ready = 1;
  }
}

// ExecutorSessionReady mirrors protocol.ExecutorSessionResponseData.
// Credential alone cannot express its three outcomes, which is why run_local
// is a separate field rather than inferred from an empty ticket:
//
//	run_local=false             a durable executor already covers this name
//	                            and owner. executor_id names it and the client
//	                            starts nothing.
//	run_local=true, no ticket   the client already holds a credential. Start
//	                            an executor and connect with the one it has.
//	run_local=true, with ticket a new row was minted. Persist the credential
//	                            and connect.
message ExecutorSessionReady {
  // executor_id names the row — minted or existing — that represents this
  // machine.
  string executor_id = 1;
  // run_local says whether the client should serve an executor at all.
  bool run_local = 2;
  // ticket authenticates the transient executor this client should now
  // start. One-shot, and revoked when this control connection closes. Empty
  // when run_local is false.
  string ticket = 3;
  // selector is the label selector the client should put on a spawn to land
  // it on this row. The client cannot build it itself: it does not know the
  // owner, which is derived server-side from the connection.
  string selector = 4;
}

// ─── User admin verbs (ctrl_user_create/list/rm) ───────────────────────────

// CreateUserRequest mints a user and its bearer token.
message CreateUserRequest {
  string username = 1;
}

// CreateUserResponse mirrors protocol.UserCreateResponseData: the plaintext
// token, the only time it is ever transmitted — the daemon stores a digest
// and cannot reproduce it. created_at deviates from the mirror: the Go field
// is an RFC3339 string, but unix seconds win, matching
// UserRow.created_at_unix.
// Never mints an admin. Admins come only from rafikid user create --admin.
message CreateUserResponse {
  string id = 1;
  string username = 2;
  string token = 3;
  int64 created_at_unix = 4;
}

// ListUsersRequest mirrors protocol.UserListRequest. Tokens are never
// returned.
message ListUsersRequest {
  bool include_deleted = 1;
  int32 limit = 2;
}

message ListUsersResponse {
  repeated UserRow users = 1;
}

// UserRow mirrors users.User (pkg/users/users.go): one identity row.
// deleted_at_unix is set when the row is tombstoned: the token no longer
// authenticates, but history still resolves the username through it.
// OMITTED: the bearer-token digest usersdb stores beside the row
// (users.HashToken) — a token is transmitted exactly once, at mint
// (CreateUserResponse.token), and only its digest is stored server-side.
message UserRow {
  string id = 1;
  string username = 2;
  bool is_admin = 3;
  int64 created_at_unix = 4;
  optional int64 deleted_at_unix = 5;
}

// RemoveUserRequest tombstones a user: the token stops working, history
// keeps resolving the username.
message RemoveUserRequest {
  string username = 1;
}
message RemoveUserResponse {}

// ─── Raw child I/O (ctrl_get_streams / ctrl_send) ──────────────────────────

// GetStreamsRequest names a live child and which streams to read: "in",
// "err", or "all" (empty means "all").
message GetStreamsRequest {
  string child_id = 1;
  string which = 2;
}

// GetStreamsResponse mirrors protocol.GetStreamsResponseData: raw,
// uncompressed stream bytes for a live child. `in` holds stdin frames (one
// []byte per frame, no trailing newline). alive=false means the child has
// already exited, signalling the caller to fall back to the on-disk dump.
// `err` is never populated for a live child by design: the stderr buffer is
// unguarded and racing the reader goroutine, so live stderr is never served
// — it is available post-exit via the on-disk dump.
message GetStreamsResponse {
  bool alive = 1;
  repeated bytes in = 2;
  bytes err = 3;
}

// SendFrameRequest forwards a raw child-protocol frame to a live child's
// stdin, for debugging and scripting. frame_json is forwarded verbatim; the
// daemon does not inspect it.
message SendFrameRequest {
  string child_id = 1;
  string frame_json = 2;
}
message SendFrameResponse {}
