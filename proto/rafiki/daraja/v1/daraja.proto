syntax = "proto3";

package rafiki.daraja.v1;

option go_package = "go.graveland.dev/rafiki/pkg/darajapb;darajapb";

// DarajaService is served BY daraja, which hosts exactly one child process.
//
// daraja moves BYTES. It never parses the child's protocol: all translation,
// persistence and state live in rafikid, where they are already a shared
// concern and where the session id that resume depends on is already resolved.
service DarajaService {
  // Relay carries the child's stdio in both directions. One stream for the
  // host's lifetime — it deliberately SURVIVES a Restart, because the consumer
  // keeps per-child state across an abort and tearing the stream down would
  // discard it.
  rpc Relay(stream RelayRequest) returns (stream RelayResponse);

  // Restart replaces the child process: signal, wait for exit, launch again
  // with the supplied spec — or the one daraja already holds, when none is
  // given. ONE verb rather than Stop plus Launch, because the
  // invariant that makes a 1:1 host simple is that a daraja always has exactly
  // one child; splitting it creates a childless daraja that then needs
  // representing, timing out and reaping.
  rpc Restart(RestartRequest) returns (RestartResponse);

  // Shutdown ends the child and then daraja exits, preserving the same
  // invariant from the other side.
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);

  rpc Health(HealthRequest) returns (HealthResponse);
}

message RelayRequest {
  // Bytes to write to the child's stdin, verbatim. No framing is imposed: the
  // child's protocol is the caller's business.
  bytes stdin = 1;
}

message RelayResponse {
  oneof event {
    bytes stdout = 1;
    ProcessRestarted restarted = 2;
    ProcessExited exited = 3;
  }
}

// ProcessRestarted marks the boundary between one child process's output and
// its replacement's, IN the byte stream.
//
// It is load-bearing rather than informational. A consumer that translates the
// child's output holds per-process state, and a replacement process starts that
// state over. Without an in-band marker the consumer cannot tell where to reset
// and carries stale state into the new process — which presents as a hung
// child, not as an error.
message ProcessRestarted {
  int32 pid = 1;
}

message ProcessExited {
  // exit_code is 0 for a signalled process, which is reported in signal
  // instead; -1 means the outcome could not be determined.
  int32 exit_code = 1;
  string signal = 2;
}

// Kind names the child protocol daraja is hosting. daraja's RELAY is entirely
// protocol-blind; only its spawn path consults this, to pick an argv builder.
// A second stdio kind is therefore additive rather than a breaking change.
enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_CLAUDE = 1;
}

message ClaudeParams {
  string model = 1;
  // resume_session is the claude session id to continue. It is the whole
  // recovery story: a daraja and its child are disposable precisely because
  // this id is a persisted column on conversations.child, so a replacement can
  // always pick the conversation back up.
  string resume_session = 2;
  string permission_mode = 3;

  // The fields below are LAUNCH-ONLY: daraja reads them once, at its own
  // process startup, to build the environment its whole lifetime uses (see
  // proxyenv.Claude) — env is fixed for a daraja process, unlike argv, which
  // Restart rebuilds per call. A Restart's ClaudeParams may leave them unset;
  // daraja ignores them there.

  // proxy_url points the child at rafiki's proxy face instead of Anthropic
  // directly. Empty means unproxied — daraja passes the environment through
  // unmodified, exactly as before these fields existed.
  string proxy_url = 4;
  // proxy_token authenticates to proxy_url. Travels here (an authenticated
  // RPC, unlike argv) but must never reach the daraja subprocess's OWN argv —
  // AdminService.Launch puts it in that process's environment instead, the
  // same treatment the launch ticket already gets, for the same reason (ps
  // is world-readable).
  string proxy_token = 5;
  // passthrough_auth omits ANTHROPIC_AUTH_TOKEN so Claude Code's own OAuth
  // subscription credential is used instead of rafiki's proxy token. rafikid
  // resolves the auto/on/off tri-state to this single bool before sending it
  // — daraja stays dumb and carries no policy of its own.
  bool passthrough_auth = 6;
  // auto_compact_window overrides Claude Code's assumed context size for a
  // proxied model it cannot otherwise verify. Zero leaves its default alone.
  int32 auto_compact_window = 7;
  // record_requests asks the proxy to persist this conversation's raw HTTP
  // traffic (X-Rafiki-Record-Requests), mirroring the local-subprocess path's
  // same request-level opt-in.
  bool record_requests = 8;
}

// ChildSpec is everything needed to (re)build the child's command line.
//
// Typed rather than raw argv because the executor's Launch and daraja's Restart
// would otherwise each need an argv builder, on opposite sides of an RPC. Both
// call pkg/claudeargv instead.
message ChildSpec {
  Kind kind = 1;
  ClaudeParams claude = 2;
}

message RestartRequest {
  // spec replaces the child. When absent, daraja reuses the spec it currently
  // holds — which is how a caller restarts without restating everything it
  // already knows.
  ChildSpec spec = 1;
  // grace_ms to wait after the interrupt before escalating to a hard kill.
  // Zero means the server default.
  int32 grace_ms = 2;
}

message RestartResponse {
  int32 pid = 1;
}

message ShutdownRequest {
  int32 grace_ms = 1;
}

message ShutdownResponse {
  int32 exit_code = 1;
  string signal = 2;
}

message HealthRequest {}

message HealthResponse {
  int32 pid = 1;
  bool running = 2;
}