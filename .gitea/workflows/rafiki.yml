name: rafiki
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'

env:
  REGISTRY: ${{ secrets.REGISTRY_URL }}/brent

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} -u push --password-stdin

      - name: Build and push
        run: |
          SHORT_SHA=$(echo "${{ gitea.sha }}" | cut -c1-8)
          IMAGE=${{ env.REGISTRY }}/rafiki
          docker build -t "$IMAGE:sha-$SHORT_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:sha-$SHORT_SHA"
          docker push "$IMAGE:latest"
