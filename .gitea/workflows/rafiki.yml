name: rafiki
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'

env:
  REGISTRY: ${{ secrets.REGISTRY_URL }}/brent

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} -u push --password-stdin

      - name: Build and push
        run: |
          SHORT_SHA=$(echo "${{ gitea.sha }}" | cut -c1-8)
          IMAGE=${{ env.REGISTRY }}/rafiki
          docker build --build-arg VERSION="$SHORT_SHA" -t "$IMAGE:sha-$SHORT_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:sha-$SHORT_SHA"
          docker push "$IMAGE:latest"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Bump rafiki image tag in graveland-iac
        run: |
          curl -sf -X POST \
            "https://git.graveland.dev/api/v1/repos/graveland.dev/graveland-iac/actions/workflows/bump-chart.yaml/dispatches" \
            -H "Authorization: token ${{ secrets.DISPATCH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main","inputs":{"chart":"rafiki","tier":"workloads","version":"1.0.0","image_tag":"sha-'"${SHORT_SHA}"'"}}'
