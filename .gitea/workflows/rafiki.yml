name: rafiki
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: registry.graveland.dev
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Build and push
        run: |
          SHORT_SHA=$(echo "${{ gitea.sha }}" | cut -c1-8)
          IMAGE=registry.graveland.dev/graveland.dev/rafiki
          docker build -t "$IMAGE:sha-$SHORT_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:sha-$SHORT_SHA"
          docker push "$IMAGE:latest"
