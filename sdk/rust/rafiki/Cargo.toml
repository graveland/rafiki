# SPDX-License-Identifier: Apache-2.0
[package]
name = "rafiki"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust client for rafiki's Connect control plane (rafikid)"
publish = false

[lib]
# The generated message docs mirror `control.proto`'s comments verbatim, and
# their indented ASCII tables are read by rustdoc as doctests. Generated code is
# never hand-edited, so the crate's doctests are off (it has none of its own).
doctest = false

[features]
# Test-only knobs (`Client::with_wire_epoch`) the live-daemon test needs to
# provoke a daemon's own refusals. Never enable it in a consumer.
test-hooks = []
# For a consumer's own tests: `Error::stream_idle_for_tests`, so a fake standing
# in for `Client::stream_events` can end a stream exactly as the idle window
# does. Enable it from `[dev-dependencies]` only, never in a production build.
test-util = []

[[test]]
name = "daemon"
required-features = ["test-hooks"]

[[test]]
name = "dial"
required-features = ["test-hooks"]

[dependencies]
base64 = "0.22"
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1", features = ["client", "http1"] }
# rustls + ring only: no aws-lc-rs, no native-tls, no openssl anywhere in this
# tree (`cargo tree -p rafiki -i aws-lc-rs` reports nothing).
hyper-rustls = { version = "0.27", default-features = false, features = [
    "ring",
    "http1",
    "native-tokio",
    "tls12",
] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio", "http1"] }
prost = "0.13"
prost-types = "0.13"
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["net", "time", "rt"] }
tower-service = "0.3"

[dev-dependencies]
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
prost = "0.13"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
